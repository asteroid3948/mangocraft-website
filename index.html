<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mango Craft &bull; Coming November 15th</title>
  <meta name="description" content="Mango Craft - Coming November 15th. Play on Java & Bedrock: play.mangocraft.xyz">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0a09;
      --orange: #ff7a18;
      --orange-bright: #ff9330;
      --white: #ffffff;
      --border: rgba(255, 255, 255, 0.08);
      --card-bg: rgba(20, 17, 14, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255, 122, 24, 0.15), transparent),
        radial-gradient(circle at 1px 1px, #1a1612 1px, transparent 0);
      background-size: 100% 100%, 32px 32px;
      color: var(--white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* TOP NAVBAR */
    header {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    /* TOP LEFT: Brand with Icon */
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--white);
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(255, 122, 24, 0.3);
      box-shadow: 0 4px 16px rgba(255, 122, 24, 0.2);
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-name span {
      color: var(--orange-bright);
    }

    /* TOP RIGHT: IP Box with copy */
    .ip-trigger {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 8px 10px 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .ip-trigger:hover {
      border-color: rgba(255, 122, 24, 0.4);
      background: rgba(26, 21, 17, 0.85);
    }

    .ip-trigger:active {
      transform: scale(0.98);
    }

    .ip-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .ip-address {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .ip-sub {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9c9187;
    }

    .ip-sub .tag {
      color: var(--orange-bright);
    }

    .copy-button {
      background: var(--orange);
      color: #0c0a09;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .ip-trigger:hover .copy-button {
      background: var(--orange-bright);
    }

    /* MIDDLE: Coming November 15th */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .center-logo {
      width: 140px;
      height: 140px;
      border-radius: 32px;
      object-fit: cover;
      box-shadow: 0 20px 50px rgba(255, 122, 24, 0.25), 0 0 0 1px rgba(255, 122, 24, 0.2);
      margin-bottom: 8px;
    }

    .pill-coming {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: rgba(255, 122, 24, 0.1);
      border: 1px solid rgba(255, 122, 24, 0.25);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--orange-bright);
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      background: var(--orange);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--orange);
    }

    h1.coming-title {
      font-size: clamp(38px, 6vw, 68px);
      font-weight: 900;
      letter-spacing: -0.035em;
      line-height: 1.08;
      color: #ffffff;
    }

    h1.coming-title span {
      background: linear-gradient(180deg, #ffffff 10%, #ffaa5e 60%, #ff7a18 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* FOOTER */
    footer {
      width: 100%;
      padding: 24px;
      text-align: center;
      font-size: 12px;
      color: #6a6159;
    }

    footer a {
      color: #9c9187;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    footer a:hover {
      color: var(--orange);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #ffffff;
      color: #0c0a09;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 9999px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .toast.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {
      header {
        padding: 16px 20px;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .brand-name {
        font-size: 20px;
      }
      .center-logo {
        width: 110px;
        height: 110px;
      }
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header>
    <!-- TOP LEFT: Icon + Mango Craft -->
    <a href="/" class="brand">
      <img src="logo.jpg" alt="Mango Craft" class="brand-logo" />
      <span class="brand-name">Mango<span>Craft</span></span>
    </a>

    <!-- TOP RIGHT: Server IP + Click to Copy + Bedrock & Java -->
    <div class="ip-trigger" id="ipBox" onclick="copyIP()" title="Click to copy server IP">
      <div class="ip-meta">
        <span class="ip-address">play.mangocraft.xyz</span>
        <span class="ip-sub"><span class="tag">Java</span> &bull; <span class="tag">Bedrock</span></span>
      </div>
      <div class="copy-button" id="copyBtn">Copy</div>
    </div>
  </header>

  <!-- MIDDLE: Coming November 15th -->
  <main>
    <div class="center-content">
      <img src="logo.jpg" alt="Mango Craft Logo" class="center-logo" />
      <div class="pill-coming">
        <span class="pill-dot"></span>
        Launch Target
      </div>
      <h1 class="coming-title">
        Coming <span>November 15th</span>
      </h1>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    &copy; 2026 mangocraft.xyz &bull; <a href="https://discord.gg/mangocraft" target="_blank" rel="noopener">discord.gg/mangocraft</a>
  </footer>

  <div class="toast" id="toast">Copied play.mangocraft.xyz!</div>

  <script>
    function copyIP() {
      navigator.clipboard.writeText("play.mangocraft.xyz").then(() => {
        const toast = document.getElementById("toast");
        const btn = document.getElementById("copyBtn");
        btn.innerText = "Copied!";
        toast.classList.add("active");
        setTimeout(() => {
          toast.classList.remove("active");
          btn.innerText = "Copy";
        }, 1800);
      });
    }
  </script>
</body>
</html>
