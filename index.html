<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangoCraft &bull; Opening November 15</title>
  <meta name="description" content="MangoCraft SkyGen - Java & Bedrock: play.mangocraft.xyz">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0a09;
      --card-bg: #14110e;
      --card-border: #231e18;
      --orange: #ff7a18;
      --orange-bright: #ff9436;
      --orange-glow: rgba(255, 122, 24, 0.15);
      --white: #ffffff;
      --gray-light: #e4dfda;
      --gray-muted: #887f77;
      --gray-dark: #1b1713;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(255, 122, 24, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 1px 1px, #1c1814 1px, transparent 0);
      background-size: 100% 100%, 28px 28px;
      color: var(--white);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 480px;
    }

    /* Top pill */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--orange-bright);
      margin-bottom: 28px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--orange);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--orange);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }

    /* Main Header */
    h1 {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 12px;
    }

    h1 span.highlight {
      color: var(--orange);
      background: linear-gradient(180deg, #ffaa5e 0%, #ff7a18 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      font-size: 15px;
      line-height: 1.5;
      color: var(--gray-muted);
      margin-bottom: 32px;
    }

    /* Main Box */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Date row */
    .date-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--card-border);
    }

    .date-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .date-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.01em;
    }

    /* IP Box */
    .ip-box {
      background: var(--gray-dark);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ip-box:hover {
      border-color: #383027;
      background: #1f1b16;
    }

    .ip-box:active {
      transform: scale(0.99);
    }

    .ip-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.02em;
    }

    .copy-pill {
      background: var(--orange);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .ip-box:hover .copy-pill {
      background: var(--orange-bright);
    }

    /* Info bullets */
    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .detail-item {
      background: var(--gray-dark);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .detail-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--gray-muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .detail-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-light);
    }

    /* Footer links */
    .links-row {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--gray-muted);
    }

    .links-row a {
      color: var(--gray-light);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .links-row a:hover {
      color: var(--orange);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      background: var(--white);
      color: var(--bg);
      font-size: 13px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 9999px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.active {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="status-badge">
      <div class="status-dot"></div>
      Coming Soon
    </div>

    <h1>Mango<span class="highlight">Craft</span></h1>
    <p class="tagline">SkyGen reimagined. Island building, generators, custom economy, and zero pay-to-win.</p>

    <div class="card">
      <div class="date-row">
        <span class="date-label">Launch Date</span>
        <span class="date-val">Nov 15, 2026</span>
      </div>

      <div class="ip-box" onclick="copy()" title="Click to copy server IP">
        <span class="ip-text">play.mangocraft.xyz</span>
        <span class="copy-pill" id="btn">Copy</span>
      </div>

      <div class="details">
        <div class="detail-item">
          <div class="detail-label">Java Edition</div>
          <div class="detail-val">1.21.x (Port: 25565)</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Bedrock Edition</div>
          <div class="detail-val">Latest (Port: 19132)</div>
        </div>
      </div>
    </div>

    <div class="links-row">
      <span>mangocraft.xyz</span>
      <a href="https://discord.gg/mangocraft" target="_blank" rel="noopener">discord.gg/mangocraft &rarr;</a>
    </div>
  </div>

  <div class="toast" id="toast">Copied play.mangocraft.xyz</div>

  <script>
    function copy() {
      navigator.clipboard.writeText("play.mangocraft.xyz").then(() => {
        const t = document.getElementById("toast");
        const b = document.getElementById("btn");
        b.innerText = "Copied!";
        t.classList.add("active");
        setTimeout(() => {
          t.classList.remove("active");
          b.innerText = "Copy";
        }, 1800);
      });
    }
  </script>
</body>
</html>
